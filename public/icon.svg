<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="white" fill-opacity="0.12"/>
  <!-- Medical Cross & Pulse Wave -->
  <g filter="url(#shadow)">
    <!-- Cross background -->
    <rect x="220" y="140" width="72" height="232" rx="20" fill="white"/>
    <rect x="140" y="220" width="232" height="72" rx="20" fill="white"/>
    <!-- Center pulse line -->
    <path d="M160 256 H215 L235 200 L260 310 L285 230 L300 270 L310 256 H352" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
